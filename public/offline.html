<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Operant Cloud — Sin conexión</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#fff}body{display:grid;place-items:center;font-family:Arial,sans-serif;color:#111}.content{text-align:center;padding:32px}.mark{width:96px;height:96px;margin-bottom:24px}.eyebrow{font-size:18px;color:#555;margin:0 0 8px}.title{font-size:38px;margin:0 0 12px;letter-spacing:-1px}.message{font-size:17px;color:#555;margin:0 0 24px}.btn_reload{display:inline-block;padding:12px 22px;border:0;border-radius:7px;background:#111;color:#fff;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}.btn_reload:hover{background:#333}.btn_reload:focus-visible{outline:3px solid #777;outline-offset:3px}
  </style>
</head>
<body>
  <main class="content" role="alert" aria-live="polite">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="9" fill="#111"/><rect x="8.5" y="8.5" width="31" height="31" rx="1.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M24 15v18M15 24h18" stroke="#fff" stroke-width="3" stroke-linecap="square"/></svg>
    <p class="eyebrow">Operant Cloud</p>
    <h1 class="title">Sin conexión</h1>
    <p class="message">No pudimos conectar con Operant Cloud. Revisa tu conexión a internet e inténtalo nuevamente.</p>
    <div id="tryagain"><a class="btn_reload" href="#">Reintentar conexión</a></div>
  </main>
</body>
</html>
